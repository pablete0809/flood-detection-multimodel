[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "floodprob-stac"
version = "0.1.0"
description = "STAC-first flood probability pipeline with Sentinel-1/2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FloodProb Team" }
]
dependencies = [
  "pystac-client>=0.8.6",
  "pystac>=1.10.1",
  "planetary-computer>=1.0.0",
  "stackstac>=0.5.1",
  "xarray>=2024.1.1",
  "dask[array]>=2024.1.1",
  "zarr>=2.17.0,<3.0",
  "rasterio>=1.3.9",
  "rioxarray>=0.15.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "geopandas>=0.14.3",
  "shapely>=2.0.2",
  "pyproj>=3.6.1",
  "scikit-learn>=1.4.1",
  "matplotlib>=3.8.2",
  "folium>=0.19.5",
  "pyyaml>=6.0.1",
  "pydantic>=2.6.1",
  "typer>=0.12.3",
  "joblib>=1.3.2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0.3"]
torch   = ["torch>=2.2.0"]
notebook = ["jupyter>=1.0.0", "ipykernel>=6.29.0"]
compare  = ["xgboost>=2.0.3", "torch>=2.2.0"]

[project.scripts]
floodprob = "floodprob.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/floodprob"]
