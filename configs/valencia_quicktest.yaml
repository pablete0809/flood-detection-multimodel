run_name: valencia_quicktest_rtc

stac:
  api_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  collections:
    s1: "sentinel-1-rtc"
    s2: "sentinel-2-l2a"
  auth:
    type: "none"
    token_env: ""
  request_timeout_s: 60
  max_items: 120

aoi_geojson: "configs/aoi_valencia_small.geojson"
crs_salida: "EPSG:25830"
resolution_m: 20
seed: 42

time:
  baseline: ["2024-08-01", "2024-09-15"]
  targets:
    - ["2024-10-28", "2024-11-02"]
  historical_windows:
    - ["2023-11-01", "2023-11-15"]

filters:
  s2_max_cloud: 40
  s1_orbit_state: "both"
  s1_polarizations: ["VV", "VH"]

dem:
  path: "data/dem/valencia_dem.tif"

external_labels:
  water: "data/labels/worldcover_water_valencia.tif"
  flood: "data/labels/emsr773_flood_mask.geojson"

outputs:
  data_dir: "data"
  cache_dir: "cache"
  out_dir: "outputs"

model:
  water_model: "logreg"
  flood_given_water_model: "logreg"
  calibration: "sigmoid"
  ensemble_n: 1
  n_hist_windows: 1
  tile_size: 128
  threshold_change:
    vv_db: -1.2
    vh_db: -1.0
  logreg:
    c: 1.0
    max_iter: 300
