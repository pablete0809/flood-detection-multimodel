run_name: malaga_dana_2025

stac:
  api_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  collections:
    s1: "sentinel-1-rtc"
    s2: "sentinel-2-l2a"
  auth:
    type: "none"
    token_env: ""
  request_timeout_s: 60
  max_items: 500

aoi_geojson: "configs/aoi_malaga.geojson"
crs_salida: "EPSG:25830"   # UTM zona 30N — cubre Andalucía
resolution_m: 10
seed: 42

# ── Ventanas temporales ────────────────────────────────────────────────────────
# Evento: DANA Valle del Guadalhorce, noche del 27-28 diciembre 2025
# Baseline: periodo seco estival previo al evento (sin inundaciones)
# Targets:  3 ventanas de ~6 días para capturar el pico, la recesión y la recuperación
# Historical: ventanas equivalentes de años anteriores para calibrar freq_agua_hist

time:
  baseline: ["2025-07-01", "2025-09-30"]

  targets:
    # Ventana 1 — pico de inundación (inmediatamente tras el evento)
    - ["2025-12-27", "2026-01-02"]
    # Ventana 2 — recesión (primera semana de enero)
    - ["2026-01-03", "2026-01-09"]
    # Ventana 3 — recuperación (segunda semana de enero)
    - ["2026-01-10", "2026-01-16"]

  historical_windows:
    # Años anteriores en meses similares (otoño-invierno: temporada húmeda Andalucía)
    - ["2022-11-01", "2022-11-15"]
    - ["2022-12-01", "2022-12-15"]
    - ["2023-11-01", "2023-11-15"]
    - ["2023-12-01", "2023-12-15"]
    - ["2024-11-01", "2024-11-15"]

filters:
  s2_max_cloud: 40            # Diciembre/enero en Málaga: más nubes; relajamos límite
  s1_orbit_state: "both"
  s1_polarizations: ["VV", "VH"]

dem:
  # Descargado por scripts/download_external_data_malaga.py
  path: "data/dem/malaga_dem.tif"

external_labels:
  # Etiqueta de agua permanente (ESA WorldCover) — descargada por el script
  water: "data/labels/worldcover_water_malaga.tif"
  # Máscara de inundación — el script busca automáticamente entre varias fuentes:
  # 1) Copernicus GFM (Global Flood Monitoring), 2) GloFAS, 3) SNCZI MITECO
  # El script guarda el resultado en la ruta siguiente (o deja vacío si ninguna disponible):
  flood: "data/labels/malaga_flood_mask.geojson"

outputs:
  data_dir: "data"
  cache_dir: "cache"
  out_dir:   "outputs"

model:
  water_model: "logreg"                # threshold_change | logreg
  flood_given_water_model: "logreg"    # logreg | xgboost_if_available
  calibration: "isotonic"              # isotonic | sigmoid
  ensemble_n: 1
  n_hist_windows: 5
  tile_size: 128
  threshold_change:
    vv_db: -1.5
    vh_db: -1.2
  logreg:
    c: 1.0
    max_iter: 400
